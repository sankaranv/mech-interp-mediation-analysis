[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mediation"
version = "1.0.0"
description = "Causal mediation analysis of attention heads and MLPs: NIE, PIE, INT and cross-interactions"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "accelerate==1.13.0",
    "nnsight==0.6.2",
    "numpy==2.4.2",
    "pandas==3.0.1",
    "scipy==1.17.1",
    "torch==2.9.1",
    "transformers==4.57.6",
]

[project.optional-dependencies]
figures = ["matplotlib==3.10.8", "seaborn==0.13.2"]
development = ["pytest==9.0.2", "ruff==0.15.5"]

[tool.setuptools.packages.find]
include = ["mediation*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# Long lines in docstrings and comments are left to the author; ruff format wraps code.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
